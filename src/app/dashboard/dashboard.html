<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Inventory</h2>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Products</a>
      <a routerLink="/cart" routerLinkActive="active" class="nav-item">Cart</a>
    </nav>
  </aside>

  <div class="content">

    <!-- TOAST -->
    <div class="toast-container">
      <div *ngIf="showToast" class="toast" [ngClass]="toastType">
        {{ toastMessage }}
      </div>
    </div>

    <!-- HEADER -->
    <div class="topbar">
      <h1>Products</h1>
      <button class="action-btn primary" (click)="addProduct()">+ Add Product</button>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <dx-data-grid
        #productGrid
        [dataSource]="products"
        keyExpr="productId"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="true"
        [showBorders]="true"

        (onRowInserted)="insertProduct($event)"
        (onRowUpdated)="updateProduct($event)"
        (onRowRemoved)="deleteProduct($event.data.productId)"
      >

        <!-- SEARCH -->
        <dxo-search-panel [visible]="true"></dxo-search-panel>

        <!-- EDITING -->
        <dxo-editing 
          mode="popup" 
          [allowAdding]="true" 
          [allowUpdating]="true" 
          [allowDeleting]="true"
        >
          <dxo-popup 
            title="Add / Edit Product" 
            [showTitle]="true" 
            [width]="500"
          ></dxo-popup>

          <!-- FORM -->
          <dxo-form [colCount]="1">

            <dxi-item dataField="name" [isRequired]="true"></dxi-item>

            <dxi-item 
              dataField="price" 
              editorType="dxNumberBox"
              [editorOptions]="{ min: 0 }"
              [isRequired]="true">
            </dxi-item>

            <dxi-item 
              dataField="stock" 
              editorType="dxNumberBox"
              [editorOptions]="{ min: 0 }"
              [isRequired]="true">
            </dxi-item>

            <dxi-item dataField="description" editorType="dxTextArea"></dxi-item>

            <!-- ✅ IMPORTANT -->
            <dxi-item 
              dataField="imageUrl"
              [editorOptions]="{ placeholder: 'Enter image URL (https://...)' }">
            </dxi-item>

          </dxo-form>
        </dxo-editing>

        <!-- COLUMNS -->
        <dxi-column dataField="name" caption="Product Name"></dxi-column>
        <dxi-column dataField="price" caption="Price" format="currency"></dxi-column>
        <dxi-column dataField="stock" caption="Stock"></dxi-column>
        <dxi-column dataField="description" caption="Description"></dxi-column>

        <!-- ✅ REQUIRED FOR BINDING -->
        <dxi-column dataField="imageUrl" [visible]="false"></dxi-column>

        <!-- IMAGE PREVIEW -->
        <dxi-column caption="Image" [width]="120" cellTemplate="imgTpl"></dxi-column>
        <div *dxTemplate="let d of 'imgTpl'">
          <img *ngIf="d.data.imageUrl" [src]="d.data.imageUrl" width="60" height="60" />
        </div>

        <!-- ACTION -->
        <dxi-column caption="Actions" cellTemplate="actionTpl" [width]="160"></dxi-column>
        <div *dxTemplate="let d of 'actionTpl'">
          <button class="action-btn add" (click)="openAddToCart(d.data.productId)">
            Add to Cart
          </button>
        </div>

      </dx-data-grid>
    </div>

  </div>
</div>
