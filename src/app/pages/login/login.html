<h2>Login</h2>

<form (ngSubmit)="onLogin()" class="form-box">

  <input
    type="email"
    [(ngModel)]="email"
    name="email"
    placeholder="Email"
    required
  />
  <br /><br />

  <input
    type="password"
    [(ngModel)]="password"
    name="password"
    placeholder="Password"
    required
  />
  <br /><br />

  <button type="submit" class="btn-login">Login</button>

</form>

<p>
  Don't have an account?
  <a routerLink="/signup">Signup</a>
</p>
