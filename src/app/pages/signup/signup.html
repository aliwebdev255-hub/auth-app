<h2>Signup</h2>

<form (ngSubmit)="onSignup()" class="form-box">

  <input
    type="text"
    [(ngModel)]="name"
    name="name"
    placeholder="Name"
    required
  />
  <br /><br />

  <input
    type="email"
    [(ngModel)]="email"
    name="email"
    placeholder="Email"
    required
  />
  <br /><br />

  <input
    type="password"
    [(ngModel)]="password"
    name="password"
    placeholder="Password"
    required
  />
  <br /><br />

  <button type="submit" class="btn-signup">Signup</button>

</form>

<p>
  Already have an account?
  <a routerLink="/">Login</a>
</p>
